    background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px #141414;
  }
  @media(min-width:460px){#phone{border-radius:28px;height:92dvh}}

  /* ---------- top bar ---------- */
  .topbar{display:flex;justify-content:flex-end;padding:14px 12px 0;flex:0 0 auto}
  .icon-btn{
    width:44px;height:44px;border:0;background:transparent;color:var(--txt);
    display:grid;place-items:center;border-radius:50%;cursor:pointer;
    transition:background-color .15s ease,transform .15s cubic-bezier(.3,0,.2,1);
  }
  .icon-btn:active{background:var(--ripple);transform:scale(.9)}
  .icon-btn svg{width:22px;height:22px;fill:currentColor}

  /* ---------- page area ---------- */
  .page{flex:1 1 auto;overflow:hidden;position:relative}
  .scroller{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;padding-bottom:var(--pad-bottom,420px);
    scrollbar-width:thin;scrollbar-color:#3a3a3a transparent;
  }
  .scroller::-webkit-scrollbar{width:3px}
  .scroller::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}

  h1.title{
    font-size:52px;font-weight:400;letter-spacing:-.5px;margin:6px 0 14px;
    padding:0 20px;line-height:1.1;
  }

  /* ---------- call log rows ---------- */
  .row{
    display:flex;align-items:center;gap:14px;padding:13px 16px;position:relative;cursor:pointer;
    transition:background-color .18s ease;
  }
  .row::after{
    content:"";position:absolute;left:78px;right:16px;bottom:0;height:1px;background:var(--row-line);
  }
  .row:active{background:#101010}
  .avatar{
    flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--avatar);
    display:grid;place-items:center;font-size:20px;color:#d6d6d6;font-weight:400;
  }
  .avatar.ar{font-family:"Noto Sans Arabic",sans-serif;font-size:19px}
  .meta{flex:1 1 auto;min-width:0}
  .name{font-size:19px;font-weight:400;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name.ar{font-family:"Noto Sans Arabic",sans-serif;direction:rtl;text-align:left}
  .name.missed{color:var(--red)}
  .sub{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--txt-dim);font-size:13.5px}
  .sub svg{width:16px;height:16px;fill:currentColor;flex:0 0 auto}
  .sub svg.missed{fill:var(--red)}
  .count{
    border:1px solid #4a4a4a;border-radius:999px;font-size:11px;line-height:1;
    padding:2px 5px;color:var(--txt-dim);
  }
  .when{color:var(--txt-dim);font-size:14px;white-space:nowrap}
  .info{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid #5f6368;
    display:grid;place-items:center;color:#9aa0a6;font-size:14px;font-style:italic;
    font-family:Georgia,serif;
  }
  .daylabel{padding:18px 20px 8px;color:var(--txt-dim);font-size:13px}

  /* ---------- number display (when typing) ---------- */
  #numberScreen{
    position:absolute;left:0;right:0;top:0;bottom:var(--sheet-h,430px);
    display:none;align-items:center;justify-content:center;
    padding:24px 20px;
  }
  #numberScreen.on{display:flex}
  #numberOut{
    font-size:30px;font-weight:300;letter-spacing:.5px;text-align:center;width:100%;
    word-break:break-all;line-height:1.3;
  }

  /* ---------- keypad sheet ---------- */
  .sheet{
    position:absolute;left:0;right:0;bottom:var(--chrome,88px);background:var(--sheet);
    border-radius:26px 26px 0 0;padding:6px 10px 0;
    transform:translateY(0);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    z-index:5;
  }
  .sheet.hidden{transform:translateY(calc(100% - 118px))}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}

  .quickrow{
    display:grid;grid-template-columns:repeat(3,1fr);padding:14px 4px 10px;
    opacity:0;height:0;overflow:hidden;transition:opacity .15s;
  }
  .quickrow.on{opacity:1;height:auto}
  .quick{
    display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;
    color:var(--txt);font-size:14.5px;font-family:inherit;cursor:pointer;padding:6px 2px;border-radius:12px;
    transition:background-color .15s ease,transform .15s cubic-bezier(.3,0,.2,1);
  }
  .quick:active{background:var(--ripple);transform:scale(.94)}
  .quick svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}

  .keys{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 0 2px}
  .key{
    background:none;border:0;color:var(--txt);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:66px;border-radius:50%;font-family:inherit;position:relative;
    transition:background-color .16s ease,transform .12s cubic-bezier(.3,0,.2,1);
  }
  .key .d{font-size:31px;font-weight:400;line-height:1}
  .key .l{font-size:10.5px;letter-spacing:2.6px;color:var(--txt-dim-2);margin-top:5px;height:12px}
  .key:active{background:#2b2b2b;transform:scale(.9)}
  .key.star .d,.key.hash .d{font-size:34px;transform:translateY(4px)}

  .actionrow{
    display:flex;align-items:center;gap:10px;padding:12px 6px 10px;
  }
  .callbtn{
    flex:1 1 0;min-width:0;height:56px;border:0;border-radius:999px;background:var(--green);
    color:#fff;font-family:inherit;font-size:17px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;
    transition:background-color .16s ease,transform .14s cubic-bezier(.3,0,.2,1);
  }
  .callbtn:active{background:var(--green-press);transform:scale(.96)}
  .callbtn svg{width:21px;height:21px;fill:#fff;flex:0 0 auto}
  .sideicon{
    flex:0 0 auto;width:44px;height:44px;border:0;background:none;color:var(--txt);
    display:grid;place-items:center;border-radius:50%;cursor:pointer;
    transition:background-color .15s ease,transform .15s cubic-bezier(.3,0,.2,1);
  }
  .sideicon:active{background:var(--ripple);transform:scale(.9)}
  .sideicon svg{width:25px;height:25px;fill:currentColor}
  .sideicon[disabled]{opacity:.28;pointer-events:none}

  /* ---------- bottom nav ---------- */
  .nav{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);
    background:var(--bg);padding:8px 0 6px;position:relative;z-index:6;
  }
  .tab{
    background:none;border:0;color:var(--txt-dim);font-family:inherit;font-size:13px;
    display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 0;
    transition:color .18s ease;
  }
  .tab svg{width:25px;height:25px;fill:currentColor;transition:transform .14s cubic-bezier(.3,0,.2,1)}
  .tab:active svg{transform:scale(.88)}
  .tab.active{color:var(--green)}
  .tab.active .lbl{color:var(--green)}
  .gesturebar{flex:0 0 auto;height:22px;display:grid;place-items:center;background:var(--bg)}
  .gesturebar i{display:block;width:132px;height:4px;border-radius:4px;background:#5a5a5a}

  /* ---------- contacts / favourites ---------- */
  .letter{padding:16px 20px 6px;color:var(--green);font-size:14px;font-weight:500}
  .favgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px}
  .fav{
    background:#141414;border:0;border-radius:18px;padding:18px 8px 14px;color:var(--txt);
    font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;
    transition:background-color .16s ease,transform .14s cubic-bezier(.3,0,.2,1);
  }
  .fav:active{background:#1e1e1e;transform:scale(.96)}
  .fav .avatar{width:58px;height:58px;font-size:22px}
  .fav span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .fav span.ar{font-family:"Noto Sans Arabic",sans-serif}
  .searchbar{
    margin:4px 16px 10px;background:#161616;border-radius:999px;height:50px;
    display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--txt-dim);font-size:16px;
  }
  .searchbar svg{width:21px;height:21px;fill:currentColor}

  /* ---------- call screen ---------- */
  #callscreen{
    position:absolute;inset:0;z-index:40;background:#070707;
    display:none;flex-direction:column;align-items:center;
    padding:70px 24px 40px;
  }
  #callscreen.on{display:flex;animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){#callscreen.on{animation:none}}
  #callName{font-size:32px;font-weight:400;text-align:center;line-height:1.2;word-break:break-all}
  #callName.ar{font-family:"Noto Sans Arabic",sans-serif}
  #callState{margin-top:12px;color:var(--txt-dim);font-size:16px;letter-spacing:.3px}
  #callAvatar{
    width:120px;height:120px;border-radius:50%;background:#222;margin-top:46px;
    display:grid;place-items:center;font-size:46px;color:#cfcfcf;
  }
  .callvia{margin-top:auto;color:var(--txt-dim-2);font-size:13.5px;display:flex;align-items:center;gap:7px}
  .callvia i{width:8px;height:8px;border-radius:50%;background:var(--green);display:block}
  .callctrls{display:grid;grid-template-columns:repeat(3,72px);gap:26px;margin:28px 0 34px}
  .cc{
    background:none;border:0;color:var(--txt);font-family:inherit;font-size:13px;
    display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;
  }
  .cc .circle{
    width:64px;height:64px;border-radius:50%;background:#1d1d1d;display:grid;place-items:center;
    transition:background-color .16s ease,transform .14s cubic-bezier(.3,0,.2,1);
  }
  .cc:active .circle{transform:scale(.9)}
  .cc.on .circle{background:#f1f1f1}
  .cc.on .circle svg{fill:#111}
  .cc svg{width:26px;height:26px;fill:#fff}
  .endcall{
    width:72px;height:72px;border-radius:50%;background:var(--red);border:0;cursor:pointer;
    display:grid;place-items:center;
    transition:background-color .16s ease,transform .14s cubic-bezier(.3,0,.2,1);
  }
  .endcall:active{background:#c02b23;transform:scale(.92)}
  .endcall svg{width:32px;height:32px;fill:#fff;transform:rotate(133deg)}

  /* ---------- USSD layer ---------- */
  #scrim{
    position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .18s linear;
  }
  #scrim.on{opacity:1;pointer-events:auto}

  .ussd-card{
    position:absolute;left:5%;right:5%;z-index:31;
    background:#2b2b2b;border-radius:28px;
    box-shadow:0 8px 28px rgba(0,0,0,.55);
    opacity:0;transform:translateY(18px) scale(.98);pointer-events:none;
    transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1),bottom .22s cubic-bezier(.2,.8,.2,1);
  }
  .ussd-card.on{opacity:1;transform:none;pointer-events:auto}
  @media (prefers-reduced-motion:reduce){
    .ussd-card{transition:none}
  }

  /* running / loading sheet */
  #ussdLoading{
    bottom:16px;display:flex;align-items:center;gap:14px;
    padding:26px 26px;min-height:96px;
  }
  #ussdLoading .lbl{flex:1 1 auto;font-size:19px;color:#f1f1f1;letter-spacing:.2px}
  .spinner{
    flex:0 0 auto;width:34px;height:34px;animation:spin .32s linear infinite;
    will-change:transform;
  }
  .spinner circle{
    fill:none;stroke:#c9c9c9;stroke-width:3;stroke-linecap:round;
    stroke-dasharray:62 26;transform-origin:center;
    animation:dash .48s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes dash{
    0%{stroke-dasharray:10 78;stroke-dashoffset:0}
    45%{stroke-dasharray:58 30;stroke-dashoffset:-16}
    100%{stroke-dasharray:10 78;stroke-dashoffset:-87}
  }
  @media (prefers-reduced-motion:reduce){
    .spinner{animation-duration:3s}
    .spinner circle{animation:none;stroke-dasharray:60 28}
  }

  /* USSD message dialog */
  #ussdDialog{bottom:24px;padding:26px 24px 22px}
  #ussdMsg{
    font-family:"Noto Sans Arabic","Roboto",sans-serif;
    direction:rtl;text-align:right;white-space:pre-line;
    font-size:17.5px;line-height:2;color:#f1f1f1;
    max-height:34vh;overflow-y:auto;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  #ussdMsg::-webkit-scrollbar{width:0;height:0;display:none}
  #ussdMsg.ltr{direction:ltr;text-align:left;font-family:"Roboto",sans-serif;line-height:1.7}
  #ussdInput{
    display:block;width:100%;height:56px;margin:22px 0 18px;
    background:#3a3a3a;border:0;border-radius:28px;outline:0;
    color:#fff;font-family:inherit;font-size:19px;padding:0 22px;
    letter-spacing:1px;
  }
  #ussdInput:focus{background:#434343}
  #ussdInput.hide{display:none}
  .ussd-actions{display:flex;gap:14px}
  .ussd-btn{
    flex:1 1 0;height:58px;border:0;border-radius:29px;background:#3a3a3a;
    color:var(--blue);font-family:"Roboto",sans-serif;font-size:19px;font-weight:400;
    cursor:pointer;transition:background-color .16s ease,transform .14s cubic-bezier(.3,0,.2,1);
  }
  .ussd-btn:active{background:#484848;transform:scale(.96)}

  /* ---------- VF-Cash notification ---------- */
  #sysNotif{
    position:absolute;left:8px;right:8px;top:8px;z-index:60;
    background:rgba(32,32,34,.97);border:1px solid rgba(255,255,255,.06);
    border-radius:22px;padding:13px 14px 15px;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
    transform:translateY(-130%);opacity:0;
    transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .28s ease;
  }
  #sysNotif.on{transform:translateY(0);opacity:1}
  @media (prefers-reduced-motion:reduce){#sysNotif{transition:none}}
  .notif-top{display:flex;align-items:center;gap:9px}
  .notif-icon{
    flex:0 0 auto;width:20px;height:20px;border-radius:0;
    background:none;display:grid;place-items:center;color:#c7cad0;
  }
  .notif-icon svg{width:19px;height:19px;fill:#c7cad0}
  .notif-app{flex:0 0 auto;font-size:13px;font-weight:500;color:#e8e8e8}
  .notif-time{flex:1 1 auto;font-size:12.5px;color:#8a8d91}
  .notif-avatar{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#3a3a3c;
    display:grid;place-items:center;
  }
  .notif-avatar svg{width:13px;height:13px;fill:#b7bac0}
  .notif-chev{flex:0 0 auto;color:#8a8d91;font-size:12px;transform:scale(1,.7)}
  .notif-body{
    margin-top:9px;font-family:"Noto Sans Arabic",sans-serif;direction:rtl;text-align:right;
    font-size:14px;line-height:1.85;color:#e2e2e2;white-space:pre-line;
  }
  .notif-body a{color:#7fb2ff}

  /* ---------- toast ---------- */
  #toast{
    position:absolute;left:18px;right:18px;bottom:96px;z-index:50;
    background:#232323;border-radius:16px;padding:16px 20px;font-size:15.5px;color:#e8e8e8;
    opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;
  }
  #toast.on{opacity:1;transform:none}
  #toast.ar{font-family:"Noto Sans Arabic",sans-serif;direction:rtl;text-align:right}
</style>

<body>
<div id="phone">

  <!-- keypad sheet -->

      </button>
      <button class="quick">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5" stroke-linecap="round"/></svg>

        <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/></svg>
      </button>
      <button class="callbtn" data-sim="Vodafone">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/></svg>

        <span>Orange EG</span>
      </button>
      <button class="sideicon" id="backspace" disabled aria-label="Backspace">
        <svg viewBox="0 0 24 24"><path d="M9 4h12v16H9L2 12zm3.4 3.6L11 9l3 3-3 3 1.4 1.4 3-3 3 3L18.8 15l-3-3 3-3-1.4-1.4-3 3z"/></svg>
      </button>
    </div>
  </div>

  <!-- call screen -->
  <div id="callscreen">
    <div id="callName"></div>
    <div id="callState">Ringing…</div>

    <div class="callvia"><i></i><span id="callVia">Calling via Vodafone</span></div>
    <div class="callctrls">
      <button class="cc" id="btnMute"><span class="circle"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></span>Mute</button>
      <button class="cc" id="btnKeypad"><span class="circle"><svg viewBox="0 0 24 24"><circle cx="7" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="17" cy="6" r="1.7"/><circle cx="7" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="17" cy="12" r="1.7"/><circle cx="7" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="17" cy="18" r="1.7"/></svg></span>Keypad</button>
      <button class="cc" id="btnSpk"><span class="circle"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></span>Speaker</button>

      <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/></svg>

  <!-- USSD layer -->

      <span class="notif-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-4.6 3.8A1 1 0 0 1 2 21V5a1 1 0 0 1 1-1z"/></svg></span>
      <span class="notif-app">VF-Cash</span>
      <span class="notif-time">now</span>
      <span class="notif-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span>
      <span class="notif-chev">⌄</span>
    </div>
    <div class="notif-body" id="notifBody"></div>
  </div>

  <div id="toast"></div>

  <nav class="nav">
    <button class="tab active" data-tab="phone">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/></svg>
      <span class="lbl">Phone</span>
    </button>
    <button class="tab" data-tab="contacts">
      <svg viewBox="0 0 24 24"><path d="M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm0 1.8c-3 0-7 1.5-7 4.4V20h14v-1.8c0-2.9-4-4.4-7-4.4zM17 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm.5 1.8c-.5 0-1 .05-1.5.14 1.5 1 2.5 2.4 2.5 4.26V20h5v-1.8c0-2.6-3.3-4.4-6-4.4z"/></svg>
      <span class="lbl">Contacts</span>
    </button>
    <button class="tab" data-tab="favourites">
      <svg viewBox="0 0 24 24"><path d="m12 17.6-5.6 3.3 1.5-6.4-4.9-4.3 6.5-.55L12 3.6l2.5 6.05 6.5.55-4.9 4.3 1.5 6.4z"/></svg>
      <span class="lbl">Favourites</span>
    </button>
  </nav>
  <div class="gesturebar"><i></i></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- data ---------------- */
  var calls = [
    {n:"Ahmed Hamdy", ar:false, t:"Yesterday", dir:"out"},
    {n:"Ahmed Ghaly", ar:false, t:"Yesterday", dir:"out"},
    {n:"طارق", ar:true, t:"Yesterday", dir:"out"},
    {n:"مصطفى", ar:true, t:"Monday", dir:"in"},
    {n:"إسلام", ar:true, t:"Monday", dir:"out"},
    {n:"سارة", ar:true, t:"Sunday", dir:"missed"},
    {n:"حسن", ar:true, t:"Thursday", dir:"out"},
    {n:"Nour", ar:false, t:"Thursday", dir:"out"},
    {n:"زياد", ar:true, t:"Wednesday", dir:"in"},
    {n:"Youssef", ar:false, t:"Wednesday", dir:"out"},
    {n:"مازن", ar:true, t:"Tuesday", dir:"out"},
    {n:"وليد", ar:true, t:"Tuesday", dir:"out"},
    {n:"Mariam", ar:false, t:"Tuesday", dir:"missed"},
    {n:"كريم", ar:true, t:"Monday", dir:"out"},
    {n:"Omar Saeed", ar:false, t:"12 Sep", dir:"in"},
    {n:"هدى", ar:true, t:"11 Sep", dir:"out"}
  ];

  var contacts = [
    {n:"Ahmed Ghaly", ar:false}, {n:"Ahmed Hamdy", ar:false},
    {n:"Karim Fouad", ar:false}, {n:"Mariam", ar:false},
    {n:"Nour", ar:false}, {n:"Omar Saeed", ar:false},
    {n:"Youssef", ar:false}, {n:"Ziad Nabil", ar:false},
    {n:"إسلام", ar:true}, {n:"حسن", ar:true}, {n:"زياد", ar:true},
    {n:"سارة", ar:true}, {n:"طارق", ar:true}, {n:"مازن", ar:true},
    {n:"مصطفى", ar:true}, {n:"وليد", ar:true}, {n:"هدى", ar:true}
  ];

  var favourites = [
    {n:"Ahmed Hamdy", ar:false}, {n:"Nour", ar:false}, {n:"سارة", ar:true},
    {n:"مصطفى", ar:true}, {n:"Youssef", ar:false}, {n:"طارق", ar:true}
  ];

  var pad = [
    ["1",""],["2","ABC"],["3","DEF"],
    ["4","GHI"],["5","JKL"],["6","MNO"],
    ["7","PQRS"],["8","TUV"],["9","WXYZ"],
    ["*","( P )"],["0","+"],["#","( W )"]
  ];

  /* ---------------- refs ---------------- */
  var $ = function(id){return document.getElementById(id);};
  var sheet=$("sheet"), keys=$("keys"), listArea=$("listArea"), scroller=$("scroller"),
      numberScreen=$("numberScreen"), numberOut=$("numberOut"), quickrow=$("quickrow"),
      backspace=$("backspace"), pageTitle=$("pageTitle"), toast=$("toast"),
      callscreen=$("callscreen"), callName=$("callName"), callState=$("callState"),
      callAvatar=$("callAvatar"), callVia=$("callVia");

  var digits = "", tab = "phone", keypadOpen = true, callTimer = null, ringTimer = null;

  /* ---------------- helpers ---------------- */
  function initial(name){ return name.trim().charAt(0).toUpperCase(); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var arrowOut = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/><path d="M15 3h6v6h-1.8V6.1l-4 4-1.3-1.3 4-4H15z"/></svg>';
  var arrowIn = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/><path d="M21 4.3 19.7 3l-4 4V4.1h-1.8v6h6V8.3h-2.9z"/></svg>';
  var arrowMissed = '<svg class="missed" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1z"/><path d="M21 4.3 19.7 3l-4 4V4.1h-1.8v6h6V8.3h-2.9z"/></svg>';

  function showToast(msg, isAr){
    toast.textContent = msg;
    toast.classList.toggle("ar", !!isAr);
    toast.classList.add("on");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove("on"); }, 1900);
  }

  /* ---------------- DTMF tones ---------------- */
  var actx = null;
  var freqs = {
    "1":[697,1209],"2":[697,1336],"3":[697,1477],
    "4":[770,1209],"5":[770,1336],"6":[770,1477],
    "7":[852,1209],"8":[852,1336],"9":[852,1477],
    "*":[941,1209],"0":[941,1336],"#":[941,1477],"+":[941,1336]
  };
  function tone(k){
    var f = freqs[k]; if(!f) return;
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var g = actx.createGain();
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, actx.currentTime+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.16);
      g.connect(actx.destination);
      f.forEach(function(hz){
        var o = actx.createOscillator();
        o.type = "sine"; o.frequency.value = hz;
        o.connect(g); o.start(); o.stop(actx.currentTime+0.17);
      });
    }catch(e){}
  }

  /* ---------------- render lists ---------------- */
  function renderCalls(){
    listArea.innerHTML = calls.map(function(c){
      var arrow = c.dir==="missed"?arrowMissed : c.dir==="in"?arrowIn : arrowOut;
      return '<div class="row" data-name="'+esc(c.n)+'" data-ar="'+c.ar+'">'+
        '<div class="avatar'+(c.ar?" ar":"")+'">'+esc(initial(c.n))+'</div>'+
        '<div class="meta">'+
          '<div class="name'+(c.ar?" ar":"")+(c.dir==="missed"?" missed":"")+'">'+esc(c.n)+'</div>'+
          '<div class="sub">'+arrow+'<span class="count">1</span><span>Egypt</span></div>'+
        '</div>'+
        '<div class="when">'+esc(c.t)+'</div>'+
        '<div class="info">i</div>'+
      '</div>';
    }).join("");
  }

  function renderContacts(){
    var out = '<div class="searchbar"><svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 1.8a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4z"/></svg>Search contacts</div>';
    var last = "";
    contacts.forEach(function(c){
      var L = initial(c.n);
      if(L !== last){ out += '<div class="letter">'+esc(L)+'</div>'; last = L; }
      out += '<div class="row" data-name="'+esc(c.n)+'" data-ar="'+c.ar+'">'+
        '<div class="avatar'+(c.ar?" ar":"")+'">'+esc(L)+'</div>'+
        '<div class="meta"><div class="name'+(c.ar?" ar":"")+'">'+esc(c.n)+'</div></div>'+
      '</div>';
    });
    listArea.innerHTML = out;
  }

  function renderFavourites(){
    listArea.innerHTML = '<div class="favgrid">'+favourites.map(function(f){
      return '<button class="fav" data-name="'+esc(f.n)+'" data-ar="'+f.ar+'">'+
        '<div class="avatar'+(f.ar?" ar":"")+'">'+esc(initial(f.n))+'</div>'+
        '<span'+(f.ar?' class="ar"':'')+'>'+esc(f.n)+'</span></button>';
    }).join("")+'</div>';
  }

  /* ---------------- keypad ---------------- */
  keys.innerHTML = pad.map(function(k){
    var cls = k[0]==="*" ? " star" : k[0]==="#" ? " hash" : "";
    return '<button class="key'+cls+'" data-k="'+k[0]+'">'+
      '<span class="d">'+k[0]+'</span><span class="l">'+k[1]+'</span></button>';
  }).join("");

  function press(k){
    digits += k;
    tone(k);
    if(navigator.vibrate) { try{ navigator.vibrate(12); }catch(e){} }
    paint();
  }

  function paint(){
    var has = digits.length > 0;
    numberOut.textContent = digits;
    numberScreen.classList.toggle("on", has && tab==="phone");
    quickrow.classList.toggle("on", has);
    backspace.disabled = !has;
    scroller.style.visibility = (has && tab==="phone") ? "hidden" : "visible";
    // auto-fit: keep the whole number on one visible line
    var w = (numberScreen.clientWidth || 360) - 40;
    var size = has ? Math.min(30, Math.max(17, w / (digits.length * 0.62))) : 30;
    numberOut.style.fontSize = size.toFixed(1) + "px";
  }

  keys.addEventListener("click", function(e){
    var b = e.target.closest(".key"); if(!b) return;
    if(!keypadOpen) openKeypad();
    press(b.dataset.k);
  });

  // long-press 0 for +
  (function(){
    var t=null;
    keys.addEventListener("pointerdown", function(e){
      var b = e.target.closest('.key[data-k="0"]'); if(!b) return;
      t = setTimeout(function(){
        digits += "+"; tone("+"); paint(); t = "done";
      }, 480);
    });
    keys.addEventListener("pointerup", function(){ if(t && t!=="done") clearTimeout(t); t=null; });
    keys.addEventListener("pointercancel", function(){ if(t && t!=="done") clearTimeout(t); t=null; });
  })();

  backspace.addEventListener("click", function(){
    digits = digits.slice(0,-1); paint();
  });
  backspace.addEventListener("pointerdown", function(){
    backspace._h = setTimeout(function(){ digits=""; paint(); }, 600);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    backspace.addEventListener(ev, function(){ clearTimeout(backspace._h); });
  });

  function openKeypad(){ keypadOpen = true; sheet.classList.remove("hidden"); syncPad(); }
  function closeKeypad(){ keypadOpen = false; sheet.classList.add("hidden"); syncPad(); }
  function syncPad(){
    scroller.style.setProperty("--pad-bottom", keypadOpen ? "510px" : "220px");
  }
  $("hideKeypad").addEventListener("click", function(){
    keypadOpen ? closeKeypad() : openKeypad();
  });

  /* ---------------- USSD engine ---------------- */
  var scrim=$("scrim"), ussdLoading=$("ussdLoading"), ussdDialog=$("ussdDialog"),
      ussdMsg=$("ussdMsg"), ussdInput=$("ussdInput");

  var ussd = { open:false, step:null, ctx:{}, timer:null };

  function isUssd(s){
    return /^[*#].*#$/.test(s);          // ex: *9*7*01229992450*200#  /  *#06#
  }

  function ussdLoad(ms, done){
    hideVfCashNotif();
    ussdDialog.classList.remove("on");
    scrim.classList.add("on");
    ussdLoading.classList.add("on");
    clearTimeout(ussd.timer);
    ussd.timer = setTimeout(function(){
      ussdLoading.classList.remove("on");
      done();
    }, ms || (1400 + Math.random()*900));
  }

  // step: {msg, ltr, input, onSend}
  function ussdShow(step){
    ussd.open = true;
    ussd.step = step;
    ussdMsg.textContent = step.msg;
    ussdMsg.classList.toggle("ltr", !!step.ltr);
    ussdInput.value = "";
    ussdInput.classList.toggle("hide", step.input === false);
    scrim.classList.add("on");
    ussdDialog.classList.add("on");
    ussdMsg.scrollTop = 0;
    if(step.input !== false){
      setTimeout(function(){
        try{ ussdInput.focus({preventScroll:true}); }catch(e){}
        adjustForKeyboard();
      }, 220);
    }
  }

  function adjustForKeyboard(){
    if(!window.visualViewport) return;
    var kb = Math.max(0, window.innerHeight - window.visualViewport.height);
    ussdDialog.style.bottom = (kb > 60 ? (kb + 14) : 24) + "px";
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", function(){
      if(ussd.open) adjustForKeyboard();
    });
  }
  ussdInput.addEventListener("blur", function(){ ussdDialog.style.bottom = "24px"; });

  function ussdClose(){
    clearTimeout(ussd.timer);
    ussd.open = false; ussd.step = null;
    ussdDialog.classList.remove("on");
    ussdDialog.style.bottom = "24px";
    ussdLoading.classList.remove("on");
    scrim.classList.remove("on");
    ussdInput.blur();
  }

  /* --- VF-Cash system notification --- */
  var sysNotif=$("sysNotif"), notifBody=$("notifBody");
  var vfBalance = 0.00;
  var notifTimer=null;

  function showVfCashNotif(num, amt){
    var fee = 1;
    vfBalance = Math.max(0, vfBalance - (Number(amt) + fee));
    var balTxt = vfBalance.toFixed(2);
    notifBody.textContent =
      "تم تحويل " + amt + " جنيه لرقم " + num + "\n" +
      "مصاريف الخدمة 1.0 جنيه\n" +
      "رصيد حسابك في فودافون كاش الحالي " + balTxt + " جنيه\n" +
      "تقدر تسحب من محفظتك برسوم 5 جنيه بس لحد النهاردة!\n" +
      "كلم *9999# واشترك عشان تسحب لحد 5000 جنيه شهريًا برسوم ثابتة وأوفر لكل عملياتك\n" +
      "http://vf.eg/vfcash";
    sysNotif.classList.add("on");
    clearTimeout(notifTimer);
    notifTimer = setTimeout(hideVfCashNotif, 5200);
  }
  function hideVfCashNotif(){
    clearTimeout(notifTimer);
    sysNotif.classList.remove("on");
  }
  sysNotif.addEventListener("click", hideVfCashNotif);

  /* --- the Vodafone credit-transfer flow: *9*7*<number>*<amount># --- */
  function transferFlow(num, amt){
    ussd.ctx = {num:num, amt:amt};
    ussdShow({
      msg: "لتحويل " + amt + " ج بالإضافة ل 1 ج رسوم لرقم\n" + num + " ...\n0:مزيد",
      onSend: function(){
        ussdLoad(1500, function(){
          ussdShow({
            msg: "ادخل الرقم السري\n1:للإعادة\n2:لمعرفة الرسوم\n00:رجوع",
            onSend: function(v){
              if(v === "00"){ ussdClose(); return; }
              ussdLoad(2000, function(){
                showVfCashNotif(num, amt);
                ussdShow({
                  msg: "تم تحويل " + amt + " جنيه لرقم " + num + "\n" +
                       "مصاريف الخدمة 1 جنيه . اطلب *9# و اشحن\n0:مزيد",
                  onSend: ussdClose,
                  onCancel: ussdClose
                });
              });
            }
          });
        });
      }
    });
  }

  function runUssd(code){
    digits = ""; paint();
    ussdLoad(0, function(){
      var m = code.match(/^\*9\*7\*(\d{8,13})\*(\d{1,5})#$/);   // transfer
      if(m){ transferFlow(m[1], m[2]); return; }

      if(/^\*#06#$/.test(code)){
        ussdShow({ msg:"IMEI\n35" + String(Math.floor(Math.random()*1e13)).padStart(13,"0"),
                   ltr:true, input:false, onSend:function(){ ussdClose(); } });
        return;
      }
      if(/^\*(100|888)#$/.test(code)){
        ussdShow({ msg:"رصيدك الحالي 47.25 جنيه\nصلاحية الرصيد حتى 30/10\n0:مزيد",
                   onSend:function(){ ussdClose(); } });
        return;
      }
      if(/^\*9#$/.test(code)){
        ussdShow({
          msg:"فودافون كاش\n1:تحويل رصيد\n2:الاستعلام عن الرصيد\n3:عروض الشحن\n0:رجوع",
          onSend:function(v){
            if(v === "1"){
              ussdLoad(1300, function(){
                ussdShow({ msg:"ادخل رقم المحول اليه", onSend:function(){ ussdClose(); } });
              });
              return;
            }
            ussdClose();
          }
        });
        return;
      }
      ussdShow({
        msg:"Connection problem or invalid MMI code.",
        ltr:true, input:false, onSend:function(){ ussdClose(); }
      });
    });
  }

  $("ussdCancel").addEventListener("click", function(){
    var step = ussd.step;
    if(step && step.onCancel){ step.onCancel(); return; }
    ussdClose();
  });
  scrim.addEventListener("click", function(){
    if(!ussd.open) return;
    var step = ussd.step;
    if(step && step.onCancel){ step.onCancel(); return; }
    ussdClose();
  });
  $("ussdSend").addEventListener("click", function(){
    if(!ussd.step) return;
    var v = ussdInput.value.trim();
    var fn = ussd.step.onSend;
    if(fn) fn(v);
  });
  ussdInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); $("ussdSend").click(); }
    e.stopPropagation();
  });

  /* ---------------- calling ---------------- */
  function startCall(label, isAr, sim){
    clearTimeout(ringTimer); clearInterval(callTimer);
    callName.textContent = label;
    callName.classList.toggle("ar", !!isAr);
    callAvatar.textContent = /^[+\d*#]/.test(label) ? "" : initial(label);
    callAvatar.innerHTML = /^[+\d*#]/.test(label)
      ? '<svg viewBox="0 0 24 24" style="width:54px;height:54px;fill:#9aa0a6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>'
      : esc(initial(label));
    callVia.textContent = "Calling via " + sim;
    callState.textContent = "Ringing…";
    callscreen.classList.add("on");

    ringTimer = setTimeout(function(){
      var s = 0;
      callTimer = setInterval(function(){
        s++;
        var m = Math.floor(s/60), r = s%60;
        callState.textContent = (m<10?"0":"")+m+":"+(r<10?"0":"")+r;
      }, 1000);
      callState.textContent = "00:00";
    }, 4200);
  }

  function endCall(){
    clearTimeout(ringTimer); clearInterval(callTimer);
    callscreen.classList.remove("on");
    ["btnMute","btnSpk"].forEach(function(id){ $(id).classList.remove("on"); });
  }
  $("endcall").addEventListener("click", endCall);
  ["btnMute","btnSpk"].forEach(function(id){
    $(id).addEventListener("click", function(){ this.classList.toggle("on"); });
  });
  $("btnKeypad").addEventListener("click", function(){
    showToast("In-call keypad is not part of this demo");
  });

  document.querySelectorAll(".callbtn").forEach(function(b){
    b.addEventListener("click", function(){
      var sim = b.dataset.sim;
      if(!digits){
        showToast("Enter a number first");
        return;
      }
      if(isUssd(digits)){ runUssd(digits); return; }
      startCall(digits, false, sim);
    });
  });

  /* row taps */
  listArea.addEventListener("click", function(e){
    var r = e.target.closest(".row, .fav"); if(!r) return;
    if(e.target.closest(".info")){ showToast("Call details are not part of this demo"); return; }
    startCall(r.dataset.name, r.dataset.ar === "true", "Vodafone");
  });

  /* ---------------- tabs ---------------- */
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
      t.classList.add("active");
      tab = t.dataset.tab;
      scroller.scrollTop = 0;
      if(tab === "phone"){
        pageTitle.textContent = "Phone"; renderCalls();
        sheet.style.display = ""; openKeypad();
      } else if(tab === "contacts"){
        pageTitle.textContent = "Contacts"; renderContacts();
        sheet.style.display = "none"; scroller.style.setProperty("--pad-bottom","40px");
      } else {
        pageTitle.textContent = "Favourites"; renderFavourites();
        sheet.style.display = "none"; scroller.style.setProperty("--pad-bottom","40px");
      }
      paint();
    });
  });

  $("kebab").addEventListener("click", function(){ showToast("Menu is not part of this demo"); });
  document.querySelectorAll(".quick").forEach(function(q){
    q.addEventListener("click", function(){ showToast("Not part of this demo"); });
  });

  /* physical keyboard */
  document.addEventListener("keydown", function(e){
    if(ussd.open || ussdLoading.classList.contains("on")){
      if(e.key === "Escape"){
        var step = ussd.step;
        if(step && step.onCancel){ step.onCancel(); } else { ussdClose(); }
      }
      return;
    }
    if(callscreen.classList.contains("on")){
      if(e.key === "Escape") endCall();
      return;
    }
    if(tab !== "phone") return;
    if(/^[0-9*#+]$/.test(e.key)){ press(e.key); }
    else if(e.key === "Backspace"){ digits = digits.slice(0,-1); paint(); }
    else if(e.key === "Enter" && digits){
      if(isUssd(digits)) runUssd(digits); else startCall(digits, false, "Vodafone");
    }
  });

  /* keep the keypad sheet sitting exactly on top of the bottom nav */
  function measureChrome(){
    var nav = document.querySelector(".nav"), gb = document.querySelector(".gesturebar");
    var h = (nav ? nav.offsetHeight : 64) + (gb ? gb.offsetHeight : 22);
    var root = document.getElementById("phone");
    root.style.setProperty("--chrome", h + "px");
    root.style.setProperty("--sheet-h", (sheet.offsetHeight || 430) + "px");
    paint();
  }
  if(window.ResizeObserver){
    try{ new ResizeObserver(function(){
      document.getElementById("phone").style.setProperty("--sheet-h", sheet.offsetHeight + "px");
      paint();
    }).observe(sheet); }catch(e){}
  }
  window.addEventListener("resize", measureChrome);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", measureChrome);

  /* init */
  measureChrome(); renderCalls(); syncPad(); paint();
})();
</script>
</body>
</html>
